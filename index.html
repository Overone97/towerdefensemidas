<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TowerDefense Midas</title>
    <meta name="description" content="TowerDefense Midas - jeu tower defense en ligne avec progression et leaderboard." />
    <meta name="author" content="Alan" />

    <meta property="og:title" content="TowerDefense Midas" />
    <meta property="og:description" content="Défends ta base, améliore tes unités et grimpe dans le leaderboard." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TowerDefense Midas" />
    <meta name="twitter:description" content="Défends ta base, améliore tes unités et grimpe dans le leaderboard." />
  </head>

  <body style="margin:0;background:#070d16;color:#fff;">
    <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,Segoe UI,Arial;">
      <div style="max-width:760px;width:100%;border:1px solid rgba(125,211,252,.35);background:rgba(14,27,45,.65);border-radius:12px;padding:16px;">
        <h2 style="margin:0 0 8px 0;font-size:22px;">🎮 Tower of Legend démarre...</h2>
        <p id="boot-message" style="margin:0 0 10px 0;opacity:.9;font-size:14px;">Chargement en cours. Si ça reste bloqué, utilise le bouton reset.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <a href="./" style="padding:8px 12px;border-radius:8px;border:1px solid #7dd3fc55;background:#0b2740;color:#dbeafe;cursor:pointer;text-decoration:none;display:inline-block;">Recharger</a>
          <a href="?reset_save=1" style="padding:8px 12px;border-radius:8px;border:1px solid #fca5a555;background:#3b0f19;color:#ffe4e6;cursor:pointer;text-decoration:none;display:inline-block;">Reset save locale</a>
          <a href="https://towerdefensemidas.overone97.workers.dev/" target="_blank" rel="noopener noreferrer" style="padding:8px 12px;border-radius:8px;border:1px solid #86efac55;background:#0d2a1d;color:#dcfce7;cursor:pointer;text-decoration:none;display:inline-block;">Ouvrir externe</a>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        const fallback = document.getElementById('boot-fallback');
        const msg = document.getElementById('boot-message');

        const url = new URL(window.location.href);
        if (url.searchParams.get('reset_save') === '1') {
          try { localStorage.removeItem('td_save_v1'); } catch {}
          url.searchParams.delete('reset_save');
          window.location.replace(url.toString());
          return;
        }

        window.addEventListener('error', (e) => {
          if (msg) msg.textContent = 'Erreur détectée: ' + (e.message || 'unknown error');
        });
        window.addEventListener('unhandledrejection', (e) => {
          const reason = (e.reason && (e.reason.message || e.reason.toString())) || 'unhandled rejection';
          if (msg) msg.textContent = 'Erreur détectée: ' + reason;
        });

        const root = document.getElementById('root');
        const startedAt = Date.now();
        let legacyInjected = false;

        const injectLegacy = () => {
          if (legacyInjected) return;
          legacyInjected = true;
          const s = document.createElement('script');
          s.src = '/assets/index-legacy.js';
          s.defer = true;
          document.body.appendChild(s);
          if (msg) msg.textContent = 'Mode compatibilité activé...';
        };

        const interval = setInterval(() => {
          if (root && root.childNodes.length > 0) {
            if (fallback) fallback.style.display = 'none';
            clearInterval(interval);
            return;
          }

          const elapsed = Date.now() - startedAt;
          if (elapsed > 3500 && !legacyInjected) injectLegacy();

          if (elapsed > 12000 && msg) {
            msg.textContent = 'Le jeu semble bloqué. Clique sur "Reset save locale" puis recharge. Si ça persiste, ouvre dans Chrome/Safari.';
          }
        }, 300);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <!-- Legacy fallback for webviews that ignore type=module -->
    <script nomodule src="/assets/index-legacy.js"></script>
  </body>
</html>
